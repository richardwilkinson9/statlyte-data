name: Publish

# Ships the package to npm and the metadata to the official MCP Registry.
# Registry auth is OIDC, so the only secret needed is NPM_TOKEN.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      id-token: write   # OIDC for the MCP Registry
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: 'https://registry.npmjs.org'

      - name: Check the package actually works before shipping it
        run: |
          node -e '
            import("./index.mjs").then(async (s) => {
              const m = await s.getModel("claude-sonnet-5", { offline: true });
              if (!m?.prices?.input) throw new Error("lookup broken");
              const c = await s.costOf("gpt-5-mini", { input: 1e6, output: 1e6 }, { offline: true });
              if (!(c > 0)) throw new Error("cost broken");
              console.log("package ok");
            }).catch((e) => { console.error(e.message); process.exit(1); });
          '
          printf '%s\n' '{"jsonrpc":"2.0","id":1,"method":"tools/list"}' \
            | node mcp-server.mjs | grep -q get_model_pricing
          echo "mcp server ok"

      - name: Keep server.json and package.json in lockstep
        run: |
          PKG=$(node -p "require('./package.json').version")
          node -e "
            const fs=require('fs'); const s=JSON.parse(fs.readFileSync('server.json','utf8'));
            s.version='$PKG'; s.packages[0].version='$PKG';
            fs.writeFileSync('server.json',JSON.stringify(s,null,2)+'\n');
          "
          echo "version $PKG"

      - name: Check the npm token before trying to publish
        # A 403 on publish is ambiguous: bad token, read-only token, or a granular
        # token not scoped to allow new packages. whoami separates those.
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if ! WHO=$(npm whoami 2>&1); then
            echo "::error::npm rejected the token outright: $WHO"
            echo "The token is invalid, revoked, or not an npm token at all."
            exit 1
          fi
          echo "authenticated to npm as: $WHO"
          echo "publishing a NEW package, which needs write access to all packages —"
          echo "a granular token limited to selected packages cannot create one."

      - name: Publish to npm
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          NAME=$(node -p "require('./package.json').name")
          VER=$(node -p "require('./package.json').version")
          if [ "$(npm view "$NAME@$VER" version 2>/dev/null)" = "$VER" ]; then
            echo "$NAME@$VER is already on npm — nothing to publish"
            exit 0
          fi
          if npm publish --access public 2>/tmp/npmerr; then
            echo "published"
          else
            cat /tmp/npmerr
            if grep -q "E403\|Forbidden" /tmp/npmerr; then
              echo "::error::npm authenticated but refused the publish. The token lacks permission to create a new package. Fix: npmjs.com > Access Tokens > Generate New Token > Classic > Automation (full rights), or a Granular token with Packages and scopes = Read and write on All packages."
            fi
            exit 1
          fi

      - name: Install mcp-publisher
        run: |
          curl -sL "https://github.com/modelcontextprotocol/registry/releases/latest/download/mcp-publisher_$(uname -s | tr '[:upper:]' '[:lower:]')_$(uname -m | sed 's/x86_64/amd64/;s/aarch64/arm64/').tar.gz" | tar xz mcp-publisher

      - name: Publish to the MCP Registry
        run: |
          ./mcp-publisher login github-oidc
          ./mcp-publisher publish
